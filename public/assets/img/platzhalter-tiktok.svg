<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" role="img"
     aria-label="Platzhalter: Handy im Hochformat mit einem Video von Sarahs TikTok-Kanal">
    <!-- PLATZHALTER für einen Screenshot aus Sarahs TikTok-Kanal. -->
    <defs>
        <clipPath id="tt-frame"><rect width="360" height="640" rx="18"/></clipPath>
        <clipPath id="tt-screen"><rect x="46" y="40" width="268" height="560" rx="28"/></clipPath>
    </defs>

    <g clip-path="url(#tt-frame)">
        <rect width="360" height="640" fill="#2B2434"/>

        <!-- Handy -->
        <rect x="38" y="32" width="284" height="576" rx="36" fill="#151021"/>
        <rect x="38" y="32" width="284" height="576" rx="36" fill="none" stroke="#544B60" stroke-width="3"/>

        <g clip-path="url(#tt-screen)">
            <rect x="46" y="40" width="268" height="560" fill="#3E3648"/>

            <!-- angedeutetes Video: Straße von oben -->
            <path d="M46 380h268v220H46Z" fill="#4A4453"/>
            <g fill="#FDF8F0" opacity=".8">
                <rect x="172" y="400" width="14" height="34" rx="4"/>
                <rect x="172" y="452" width="14" height="34" rx="4"/>
                <rect x="172" y="504" width="14" height="34" rx="4"/>
                <rect x="172" y="556" width="14" height="34" rx="4"/>
            </g>
            <circle cx="180" cy="220" r="66" fill="#7C3AED" opacity=".35"/>
            <circle cx="112" cy="300" r="46" fill="#189A9C" opacity=".30"/>
            <circle cx="252" cy="304" r="52" fill="#E8B517" opacity=".28"/>

            <!-- Play-Symbol -->
            <g transform="translate(180 250)">
                <circle r="46" fill="#FDF8F0" opacity=".92"/>
                <path d="M-14-20 22 0-14 20Z" fill="#2B2434"/>
            </g>

            <!-- Bildunterschrift wie in einem Kurzvideo -->
            <rect x="66" y="352" width="150" height="12" rx="6" fill="#FDF8F0" opacity=".65"/>
            <rect x="66" y="372" width="104" height="12" rx="6" fill="#FDF8F0" opacity=".4"/>
        </g>

        <!-- Regenbogen-Kante -->
        <g>
            <rect y="632" width="51.4" height="8" fill="#E4572E"/>
            <rect x="51.4"  y="632" width="51.4" height="8" fill="#F08A24"/>
            <rect x="102.8" y="632" width="51.4" height="8" fill="#E8B517"/>
            <rect x="154.2" y="632" width="51.4" height="8" fill="#3EA55B"/>
            <rect x="205.6" y="632" width="51.4" height="8" fill="#189A9C"/>
            <rect x="257"   y="632" width="51.4" height="8" fill="#3B7DD8"/>
            <rect x="308.4" y="632" width="51.6" height="8" fill="#7C3AED"/>
        </g>
    </g>
</svg>
